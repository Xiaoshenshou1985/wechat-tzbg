<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资日报 | 微信公众号</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fafaf8;
    color: #1a1a1a;
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    font-weight: 350;
    line-height: 1.8;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 64px 32px 80px;
  }
  .header {
    border-left: 4px solid #c9a227;
    padding-left: 20px;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 30px;
    font-weight: 400;
    color: #2e564f;
    letter-spacing: 2px;
  }
  .header .sub {
    font-size: 14px;
    color: #888;
    margin-top: 8px;
    font-weight: 350;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card {
    display: block;
    background: #fff;
    border: 1px solid #f0ece4;
    border-radius: 6px;
    padding: 22px 24px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(46, 86, 79, 0.10);
    border-color: #c9a227;
  }
  .card .title {
    font-size: 18px;
    font-weight: 450;
    color: #2e564f;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .card .desc {
    font-size: 13px;
    color: #666;
    line-height: 1.7;
  }
  .card .date {
    display: inline-block;
    margin-top: 12px;
    font-size: 12px;
    color: #c9a227;
    font-weight: 400;
  }
  .footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid #e8e4dc;
    font-size: 12px;
    color: #999;
    text-align: center;
    line-height: 1.9;
  }
</style>
</head>
<body>
<div class="container">

  </div>

  <div class="grid">
    <a class="card" href="a-stock/">

      <span class="date">最新：2026-08-21</span>
    </a>

    <a class="card" href="us-stock/">
      <div class="title">美股盘前日报</div>
      <div class="desc">隔夜美股走势、重要指数与个股异动，把握隔夜外围信息。</div>
      <span class="date">最新：2026-08-20</span>
    </a>

    <a class="card" href="w-stock-summary/">

      <div class="desc">一周一结，梳理全周 A股 / 美股关键行情与资金脉络。</div>
      <span class="date">最新：2026-08-10 ~ 08-14</span>

    <a class="card" href="e-stock-summary/">
      <div class="title">A股盘后总结</div>
      <div class="desc">收盘后复盘当日盘面、技术面信号与次日关注要点。</div>
      <span class="date">最新：2026-08-14</span>
    </a>
  </div>

  <div class="footer">
    本报告仅供参考，不构成投资建议<br>
    数据来源：公开行情接口 · 生成于 2026-08-21
  </div>
</div>
</body>
</html>
